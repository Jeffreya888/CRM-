# Installs or updates the production backend: database (migrations) and edge
# functions. Run it by hand from the Actions tab ("Run workflow").
# Needs repository secrets:
#   SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_ID    (Project Settings → General → Project ID)
#   SUPABASE_DB_PASSWORD   (the database password chosen when creating the project)
name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Also deploy the edge functions'
        type: boolean
        default: true

concurrency: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Apply database migrations
        run: supabase db push --include-all
      - name: Deploy edge functions
        if: inputs.functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
